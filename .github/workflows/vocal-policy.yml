name: Vocal policy and alignment checks

on:
  pull_request:
    branches:
      - feature/vocal-decision-manifest-v1
      - feature/vocal-vote-policy-v1
    paths:
      - 'app/vocal_policy.py'
      - 'app/vocal_align.py'
      - 'tests/test_vocal_policy.py'
      - 'tests/test_vocal_align.py'
      - 'docs/vocal-alignment.md'
      - '.github/workflows/vocal-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install model-free test tools
        run: python -m pip install pytest==8.4.2 ruff==0.16.6
      - name: Compile policy and contract
        run: python -m compileall -q app/vocal_decisions.py app/vocal_policy.py app/vocal_align.py tests/test_vocal_policy.py tests/test_vocal_align.py
      - name: Lint new policy and tests
        run: python -m ruff check app/vocal_policy.py app/vocal_align.py tests/test_vocal_policy.py tests/test_vocal_align.py
      - name: Run policy and schema tests without backend imports
        run: python -m pytest --noconftest tests/test_vocal_decisions.py tests/test_vocal_policy.py tests/test_vocal_align.py -q
