# Lightweight, isolated validation of the opt-in vocal-dubbing prototype.
# Does not download ASR/TTS weights, invoke APIs, or run the production app.
name: Vocal prototype checks

on:
  pull_request:
    branches:
      - main
      - feature/vocal-decision-manifest-v1
      - feature/vocal-pcm-assembler-v1
    paths:
      - 'app/vocal_*.py'
      - 'tests/test_vocal_*.py'
      - 'docs/vocal-*.md'
      - '.github/workflows/vocal-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-free:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test runner only
        run: python -m pip install pytest==8.4.2
      - name: Compile pure-Python modules
        run: python -m compileall -q app/vocal_decisions.py app/vocal_pcm.py app/vocal_benchmark.py app/vocal_offline_demo.py
      - name: Lint vocal prototype with pinned upstream Ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          python -m pip install -r requirements-dev.txt
          ruff check app/vocal_decisions.py app/vocal_pcm.py app/vocal_benchmark.py app/vocal_offline_demo.py tests/test_vocal_decisions.py tests/test_vocal_pcm.py tests/test_vocal_benchmark.py tests/test_vocal_offline_demo.py
      # These isolated tests have no dependency on the production app.
      # The standard tests/conftest.py imports full backend dependencies.
      - name: Run model-free vocal contract and integration tests
        run: python -m pytest --noconftest tests/test_vocal_decisions.py tests/test_vocal_pcm.py tests/test_vocal_benchmark.py tests/test_vocal_offline_demo.py -q
